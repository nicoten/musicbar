<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#2a2f8f"/>
    </linearGradient>
    <linearGradient id="note" gradientUnits="userSpaceOnUse" x1="0" y1="355" x2="0" y2="690">
      <stop offset="0" stop-color="#4f6ff5"/>
      <stop offset="1" stop-color="#2a2f8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0e3a" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- macOS-style tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- menu bar -->
    <rect x="100" y="100" width="824" height="150" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="100" y="249" width="824" height="3" fill="#ffffff" fill-opacity="0.25"/>
    <g fill="#ffffff" fill-opacity="0.55">
      <rect x="230" y="163" width="70" height="24" rx="12"/>
      <rect x="725" y="163" width="56" height="24" rx="12"/>
    </g>
    <!-- the active MusicBar item -->
    <rect x="352" y="136" width="320" height="78" rx="39" fill="#ffffff"/>
    <g fill="#2a2f8f">
      <ellipse cx="412" cy="187" rx="17" ry="12.5" transform="rotate(-22 412 187)"/>
      <rect x="425" y="146" width="7" height="42" rx="2"/>
      <path d="M432 146 q 22 8 22 30 q -6 -12 -22 -14 z"/>
      <rect x="478" y="168" width="160" height="14" rx="7" fill-opacity="0.35"/>
    </g>

    <!-- dropdown panel -->
    <g filter="url(#shadow)">
      <rect x="272" y="290" width="480" height="520" rx="64" fill="#ffffff"/>
    </g>
    <!-- beamed eighth notes -->
    <g fill="url(#note)">
      <ellipse cx="420" cy="640" rx="62" ry="46" transform="rotate(-22 420 640)"/>
      <ellipse cx="610" cy="600" rx="62" ry="46" transform="rotate(-22 610 600)"/>
      <rect x="459" y="400" width="24" height="245"/>
      <rect x="649" y="360" width="24" height="245"/>
      <path d="M459 395 L673 355 L673 425 L459 465 Z"/>
    </g>
    <!-- countdown bar -->
    <rect x="352" y="730" width="320" height="18" rx="9" fill="#2a2f8f" fill-opacity="0.12"/>
    <rect x="352" y="730" width="210" height="18" rx="9" fill="#4f6ff5"/>
  </g>
</svg>
